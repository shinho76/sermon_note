<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>말씀요약 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 상단 제목 + 설교 탭 / 좌측 고정 사이드 패널(설교 정보·목차) / 우측 본문 */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --ink:#1d2433; --muted:#5d6678; --line:#dde1e8;
  --accent:#2f4a7a; --brass:#9a7426; --brass-soft:#f3ecdc; --chip:#e9eef6;
  --f-display:"Gowun Batang","Noto Serif KR",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141821; --surface:#1c2130; --ink:#e6e9f0; --muted:#9aa3b5; --line:#2e3547;
  --accent:#9db6e6; --brass:#d8b56a; --brass-soft:#2c2718; --chip:#26304a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141821; --surface:#1c2130; --ink:#e6e9f0; --muted:#9aa3b5; --line:#2e3547;
  --accent:#9db6e6; --brass:#d8b56a; --brass-soft:#2c2718; --chip:#26304a; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
header.top{background:var(--surface);border-bottom:1px solid var(--line);padding:18px 16px}
.top-inner{max-width:1240px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-size:1.6rem;margin:0;font-weight:700}
.brand span{color:var(--muted);font-size:.85rem}
.side-h{font-size:.74rem;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:0 0 6px 4px}
.tabs{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;gap:2px}
.tab{font:inherit;text-align:left;border:none;border-left:3px solid transparent;background:transparent;color:var(--ink);
  padding:7px 10px;border-radius:0 6px 6px 0;cursor:pointer;display:grid;grid-template-columns:42px minmax(0,1fr);gap:2px 8px;align-items:baseline}
.tab .d{font-variant-numeric:tabular-nums;color:var(--brass);font-weight:600;font-size:.82rem}
.tab .t{font-size:.9rem;line-height:1.35}
.tab .r{grid-column:2;font-size:.74rem;color:var(--muted)}
.tab:hover{background:var(--bg)}
.tab[aria-selected="true"]{background:var(--chip);border-left-color:var(--brass)}
.tab[aria-selected="true"] .t{color:var(--accent);font-weight:600}
.tab:focus-visible,.nav a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;align-items:start}
aside{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto;display:flex;flex-direction:column;gap:16px}
#side{display:flex;flex-direction:column;gap:16px}
.meta{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.meta dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.85rem}
.meta dt{color:var(--muted)} .meta dd{margin:0;font-variant-numeric:tabular-nums}
.meta a{color:var(--accent)}
.nav{display:flex;flex-direction:column;gap:2px;font-size:.9rem}
.nav a{color:var(--ink);text-decoration:none;padding:6px 10px;border-radius:6px}
.nav a:hover{background:var(--chip)}
.nav a b{color:var(--brass);font-variant-numeric:tabular-nums;margin-right:6px}
main{min-width:0;display:flex;flex-direction:column;gap:22px}
.hero{padding-bottom:6px}
.hero .eyebrow{font-size:.78rem;letter-spacing:.08em;color:var(--brass);font-weight:600}
.hero h2{font-family:var(--f-display);font-size:1.9rem;line-height:1.35;margin:6px 0 14px;text-wrap:balance}
.verse{background:var(--brass-soft);border-left:3px solid var(--brass);padding:14px 18px;border-radius:0 8px 8px 0;font-family:var(--f-display);font-size:1.02rem;max-width:72ch}
.verse cite{display:block;margin-top:8px;font-family:var(--f-body);font-style:normal;font-size:.8rem;color:var(--muted)}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px 24px;scroll-margin-top:16px}
section.card h3{font-family:var(--f-display);font-size:1.25rem;margin:0 0 12px;display:flex;gap:10px;align-items:baseline}
section.card h3 small{font-family:var(--f-body);font-size:.8rem;color:var(--brass);font-weight:600}
.lead{font-size:1.08rem;font-weight:600;color:var(--accent);margin:0 0 10px;max-width:70ch}
p,li{max-width:74ch}
.kw{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:0}
.kw li{background:var(--chip);color:var(--accent);padding:5px 12px;border-radius:999px;font-size:.88rem;font-weight:500}
.kw li em{font-style:normal;color:var(--muted);font-weight:400;margin-left:4px;font-size:.8rem}
.chap{border-top:1px solid var(--line);padding-top:14px;margin-top:14px;display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px}
.chap:first-of-type{border-top:none;margin-top:0;padding-top:0}
.ts{font-variant-numeric:tabular-nums;color:var(--brass);font-weight:600;font-size:.9rem;padding-top:2px}
.chap h4{margin:0 0 4px;font-size:1rem}
.chap ul{margin:0;padding-left:1.1em}
.ref{color:var(--muted);font-size:.84rem}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.88rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:.8rem;letter-spacing:.04em}
td:first-child{white-space:nowrap;color:var(--brass);font-weight:600}
.ins{display:grid;gap:12px;padding:0;list-style:none;margin:0}
.ins li{padding-left:14px;border-left:2px solid var(--line)}
.ins b{color:var(--accent)}
.note{font-size:.8rem;color:var(--muted)}
@media (max-width:860px){.wrap{grid-template-columns:1fr}aside{position:static;max-height:none}.nav{flex-direction:row;flex-wrap:wrap}}
@media (max-width:480px){section.card{padding:18px 16px}.chap{grid-template-columns:1fr;gap:2px}.hero h2{font-size:1.5rem}}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
</head>
<body>

<style>
.lock{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg)}
.lock-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 24px;box-shadow:0 6px 24px rgba(20,30,50,.06);text-align:center}
.lock-card h1{font-family:var(--f-display);font-size:1.5rem;margin:0 0 6px;color:var(--ink)}
.lock-card p{margin:0 0 20px;color:var(--muted);font-size:.92rem}
.lock-card input{width:100%;box-sizing:border-box;font:inherit;font-size:1.1rem;letter-spacing:.2em;text-align:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.lock-card input:focus{outline:2px solid var(--accent);outline-offset:1px}
.lock-card button{margin-top:12px;width:100%;font:inherit;font-weight:600;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
.lock-card button:disabled{opacity:.6;cursor:wait}
.lock-card label{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:12px;font-size:.85rem;color:var(--muted)}
.lock-err{min-height:1.2em;margin-top:10px;color:#b3261e;font-size:.88rem}
</style>
<div class="lock" id="lock">
  <form class="lock-card" id="lockForm" autocomplete="off">
    <h1>말씀요약 노트</h1>
    <p>비밀번호를 입력하면 내용을 볼 수 있습니다.</p>
    <input id="pw" type="password" inputmode="numeric" placeholder="비밀번호" aria-label="비밀번호" autofocus>
    <label><input type="checkbox" id="keep" style="width:auto"> 이 탭을 닫을 때까지 기억</label>
    <button id="go" type="submit">열기</button>
    <div class="lock-err" id="err" role="alert"></div>
  </form>
</div>
<div id="app" hidden></div>

const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
function show(p){
  document.getElementById('lock').remove();
  const app=document.getElementById('app');app.innerHTML=p.html;app.hidden=false;
  const s=document.createElement('script');s.textContent=p.js;document.body.appendChild(s);
}
async function tryOpen(pw,remember){
  const p=await open(pw);
  if(remember){try{sessionStorage.setItem('mn-pw',pw)}catch(e){}}
  show(p);
}
let saved=null;try{saved=sessionStorage.getItem('mn-pw')}catch(e){}
if(saved){tryOpen(saved,false).catch(()=>{try{sessionStorage.removeItem('mn-pw')}catch(e){}})}
const f=document.getElementById('lockForm'),b=document.getElementById('go'),err=document.getElementById('err'),inp=document.getElementById('pw');
f.addEventListener('submit',async e=>{
  e.preventDefault();err.textContent='';b.disabled=true;b.textContent='확인 중…';
  try{await tryOpen(inp.value,document.getElementById('keep').checked)}
  catch(x){err.textContent='비밀번호가 맞지 않습니다.';inp.select();b.disabled=false;b.textContent='열기'}
});
})();
</script>
