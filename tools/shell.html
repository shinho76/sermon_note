<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>말씀요약 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 상단 제목 + 설교 탭 / 좌측 고정 사이드 패널(설교 정보·목차) / 우측 본문 */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --ink:#1d2433; --muted:#5d6678; --line:#dde1e8;
  --accent:#2f4a7a; --brass:#9a7426; --brass-soft:#f3ecdc; --chip:#e9eef6;
  --f-display:"Gowun Batang","Noto Serif KR",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141821; --surface:#1c2130; --ink:#e6e9f0; --muted:#9aa3b5; --line:#2e3547;
  --accent:#9db6e6; --brass:#d8b56a; --brass-soft:#2c2718; --chip:#26304a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141821; --surface:#1c2130; --ink:#e6e9f0; --muted:#9aa3b5; --line:#2e3547;
  --accent:#9db6e6; --brass:#d8b56a; --brass-soft:#2c2718; --chip:#26304a; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
header.top{background:var(--surface);border-bottom:1px solid var(--line);padding:18px 16px}
.top-inner{max-width:1240px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-size:1.6rem;margin:0;font-weight:700}
.brand span{color:var(--muted);font-size:.85rem}
.side-h{font-size:.74rem;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:0 0 6px 4px}
.tabs{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;gap:2px}
.tab{font:inherit;text-align:left;border:none;border-left:3px solid transparent;background:transparent;color:var(--ink);
  padding:7px 10px;border-radius:0 6px 6px 0;cursor:pointer;display:grid;grid-template-columns:42px minmax(0,1fr);gap:2px 8px;align-items:baseline}
.tab .d{font-variant-numeric:tabular-nums;color:var(--brass);font-weight:600;font-size:.82rem}
.tab .t{font-size:.9rem;line-height:1.35}
.tab .r{grid-column:2;font-size:.74rem;color:var(--muted)}
.tab:hover{background:var(--bg)}
.tab[aria-selected="true"]{background:var(--chip);border-left-color:var(--brass)}
.tab[aria-selected="true"] .t{color:var(--accent);font-weight:600}
.tab:focus-visible,.nav a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;align-items:start}
aside{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto;display:flex;flex-direction:column;gap:16px}
#side{display:flex;flex-direction:column;gap:16px}
.meta{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.meta dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.85rem}
.meta dt{color:var(--muted)} .meta dd{margin:0;font-variant-numeric:tabular-nums}
.meta a{color:var(--accent)}
.nav{display:flex;flex-direction:column;gap:2px;font-size:.9rem}
.nav a{color:var(--ink);text-decoration:none;padding:6px 10px;border-radius:6px}
.nav a:hover{background:var(--chip)}
.nav a b{color:var(--brass);font-variant-numeric:tabular-nums;margin-right:6px}
main{min-width:0;display:flex;flex-direction:column;gap:22px}
.hero{padding-bottom:6px}
.hero .eyebrow{font-size:.78rem;letter-spacing:.08em;color:var(--brass);font-weight:600}
.hero h2{font-family:var(--f-display);font-size:1.9rem;line-height:1.35;margin:6px 0 14px;text-wrap:balance}
.verse{background:var(--brass-soft);border-left:3px solid var(--brass);padding:14px 18px;border-radius:0 8px 8px 0;font-family:var(--f-display);font-size:1.02rem;max-width:72ch}
.verse cite{display:block;margin-top:8px;font-family:var(--f-body);font-style:normal;font-size:.8rem;color:var(--muted)}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px 24px;scroll-margin-top:16px}
section.card h3{font-family:var(--f-display);font-size:1.25rem;margin:0 0 12px;display:flex;gap:10px;align-items:baseline}
section.card h3 small{font-family:var(--f-body);font-size:.8rem;color:var(--brass);font-weight:600}
.lead{font-size:1.08rem;font-weight:600;color:var(--accent);margin:0 0 10px;max-width:70ch}
p,li{max-width:74ch}
.kw{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:0}
.kw li{background:var(--chip);color:var(--accent);padding:5px 12px;border-radius:999px;font-size:.88rem;font-weight:500}
.kw li em{font-style:normal;color:var(--muted);font-weight:400;margin-left:4px;font-size:.8rem}
.chap{border-top:1px solid var(--line);padding-top:14px;margin-top:14px;display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px}
.chap:first-of-type{border-top:none;margin-top:0;padding-top:0}
.ts{font-variant-numeric:tabular-nums;color:var(--brass);font-weight:600;font-size:.9rem;padding-top:2px}
.chap h4{margin:0 0 4px;font-size:1rem}
.chap ul{margin:0;padding-left:1.1em}
.ref{color:var(--muted);font-size:.84rem}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.88rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:.8rem;letter-spacing:.04em}
td:first-child{white-space:nowrap;color:var(--brass);font-weight:600}
.ins{display:grid;gap:12px;padding:0;list-style:none;margin:0}
.ins li{padding-left:14px;border-left:2px solid var(--line)}
.ins b{color:var(--accent)}
.note{font-size:.8rem;color:var(--muted)}
@media (max-width:860px){.wrap{grid-template-columns:1fr}aside{position:static;max-height:none}.nav{flex-direction:row;flex-wrap:wrap}}
@media (max-width:480px){section.card{padding:18px 16px}.chap{grid-template-columns:1fr;gap:2px}.hero h2{font-size:1.5rem}}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
/* 목차 0~5: 본문 상단에 고정되는 가로 바 */
.toc{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;margin-inline:-4px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.toc a{display:inline-flex;align-items:baseline;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);text-decoration:none;font-size:.88rem;white-space:nowrap}
.toc a:hover{background:var(--chip);border-color:var(--accent)}
.toc a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toc a b{color:var(--brass);font-variant-numeric:tabular-nums}
section.card,.hero{scroll-margin-top:64px}
@media (max-width:480px){.toc{gap:4px;padding:8px}.toc a{padding:5px 10px;font-size:.82rem}}
/* 상단 검색 */
.top-inner{display:flex;align-items:center;justify-content:space-between;gap:12px 24px;flex-wrap:wrap}
.search{position:relative;flex:1 1 280px;max-width:440px}
.search input{width:100%;font:inherit;font-size:.92rem;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink)}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px;background:var(--surface)}
.search-ic{position:absolute;left:12px;top:50%;width:16px;height:16px;transform:translateY(-50%);fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;pointer-events:none}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:20;max-height:min(70vh,520px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(15,25,45,.14);padding:6px}
.r-head{font-size:.76rem;color:var(--muted);padding:6px 10px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.r-none{margin:10px;color:var(--muted);font-size:.88rem}
.hit{display:grid;grid-template-columns:78px minmax(0,1fr);gap:2px 10px;width:100%;text-align:left;font:inherit;border:0;background:transparent;color:var(--ink);padding:8px 10px;border-radius:8px;cursor:pointer}
.hit:hover,.hit.on{background:var(--chip)}
.hd{font-size:.78rem;color:var(--brass);font-weight:600;font-variant-numeric:tabular-nums;padding-top:2px}
.ht{font-size:.92rem;font-weight:600}
.ht em{font-style:normal;font-weight:400;font-size:.74rem;color:var(--muted);margin-left:6px}
.hs{grid-column:2;font-size:.8rem;color:var(--muted);line-height:1.5}
mark{background:#f6e3a8;color:inherit;border-radius:2px;padding:0 1px}
:root[data-theme="dark"] mark{background:#6b5520}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) mark{background:#6b5520}}
/* 사이드 목록: 연도 · 분기 */
.list-box{display:flex;flex-direction:column;gap:8px;min-height:0}
.years{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.yr{font:inherit;font-weight:700;font-size:.95rem;border:0;border-radius:7px;padding:7px 4px;background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:baseline;justify-content:center;gap:6px}
.yr small{font-weight:400;font-size:.72rem}
.yr{flex-direction:column;align-items:center;gap:0;line-height:1.25;padding:6px 2px}
.yr[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.quarters{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.qb{font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:5px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.25}
.qb b{font-size:.8rem;color:var(--brass)}
.qb small{font-size:.64rem;color:var(--muted)}
.qb:hover:not(:disabled){border-color:var(--accent);background:var(--chip)}
.qb:disabled{opacity:.4;cursor:default}
.yr:focus-visible,.qb:focus-visible,.hit:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#tabs{max-height:max(260px,calc(100vh - 330px));overflow-y:auto;position:relative;flex:none}
.list-box,#side{flex:none}
.qhead{position:sticky;top:-6px;z-index:1;background:var(--surface);font-size:.76rem;font-weight:700;color:var(--accent);padding:8px 8px 4px;border-bottom:1px solid var(--line);margin-bottom:2px}
.qhead span{font-weight:400;color:var(--muted);margin-left:4px}
.qgroup+.qgroup{margin-top:6px}
.qgroup .tab{width:100%}
@media (max-width:860px){#tabs{max-height:46vh}}
/* 보기 항목 체크박스 */
.toc-wrap{position:sticky;top:0;z-index:5;margin-inline:-4px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 12px 8px;display:flex;flex-direction:column;gap:8px}
.toc-wrap .toc{position:static;padding:0;margin:0;background:none;backdrop-filter:none;border:0}
.toc a.off{opacity:.35;pointer-events:none}
.view{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-size:.82rem;color:var(--muted)}
.view-h{font-weight:700;color:var(--accent);font-size:.76rem;letter-spacing:.06em}
.vc{display:inline-flex;align-items:center;gap:4px;cursor:pointer;user-select:none}
.vc input{accent-color:var(--accent);width:15px;height:15px;margin:0;cursor:pointer}
.vc b{color:var(--brass);font-variant-numeric:tabular-nums}
.vall{font:inherit;font-size:.76rem;border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:999px;padding:2px 10px;cursor:pointer;margin-left:auto}
.vall:hover{border-color:var(--accent)}
.vc:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
main[data-off~="v"] [data-sec="v"],main[data-off~="c"] [data-sec="c"],main[data-off~="k"] [data-sec="k"],main[data-off~="o"] [data-sec="o"],main[data-off~="d"] [data-sec="d"],main[data-off~="i"] [data-sec="i"]{display:none}
@media (max-width:480px){.view{gap:4px 10px}.vall{margin-left:0}}
/* 사이드: 요약 항목 체크박스 */
.sec-box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 10px 8px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.sec-head .side-h{margin:0}
.sec-head .side-h span{font-weight:400;letter-spacing:0;margin-left:4px}
.sec-all{font:inherit;font-size:.74rem;border:1px solid var(--line);background:var(--bg);color:var(--accent);border-radius:999px;padding:1px 10px;cursor:pointer}
.sec-all:disabled{opacity:.4;cursor:default}
.secs{display:grid;grid-template-columns:1fr;gap:1px}
.sec{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:.86rem;user-select:none}
.sec:hover{background:var(--bg)}
.sec input{accent-color:var(--accent);width:15px;height:15px;margin:0;cursor:pointer;flex:none}
.sec b{color:var(--brass);font-variant-numeric:tabular-nums;font-size:.82rem}
.sec:has(input:checked){background:var(--chip)}
.sec:has(input:checked) span{color:var(--accent);font-weight:600}
.sec:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:1px}
@media (max-width:860px){.secs{grid-template-columns:1fr 1fr}}
#tabs{max-height:max(220px,calc(100vh - 600px))}
.years{grid-template-columns:repeat(4,1fr)}
@media (max-width:860px){#tabs{max-height:46vh}}
/* 요약 항목 위치 고정 */
.sec-box{position:sticky;top:0;z-index:3;box-shadow:0 0 0 6px var(--bg)}
.sec-all{white-space:nowrap;flex:none}
.secs-m{display:none}
@media (max-width:860px){
  .secs-m{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:.8rem;color:var(--ink)}
  .secs-m label{display:inline-flex;align-items:center;gap:3px;cursor:pointer}
  .secs-m input{accent-color:var(--accent);width:15px;height:15px;margin:0}
  .secs-m b{color:var(--brass)}
  .secs-m button{font:inherit;font-size:.74rem;border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:999px;padding:1px 9px;cursor:pointer}
  .toc-wrap .toc{display:none}
}
/* 6. 본문 성경말씀 목록 */
.qb[aria-pressed="true"]{background:var(--chip);border-color:var(--brass)}
.vhead h2{font-family:var(--f-display);font-size:1.5rem;margin:0 0 4px}
.vhead p{margin:0 0 14px;color:var(--muted);font-size:.85rem}
.vlist{display:flex;flex-direction:column;gap:8px}
.vrow{font:inherit;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 16px;cursor:pointer;display:grid;grid-template-columns:130px minmax(0,1fr);gap:2px 14px;align-items:baseline}
.vrow:hover,.vrow:focus-visible{border-color:var(--accent);outline:none}
.vrow .vd{color:var(--brass);font-weight:600;font-size:.85rem;font-variant-numeric:tabular-nums}
.vrow .vh{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px}
.vrow .vt{font-weight:600;font-size:1rem}
.vrow .vr{color:var(--accent);font-size:.92rem;font-weight:500}
.vrow .vv{grid-column:2;color:var(--ink);font-size:1.05rem;line-height:1.85;font-family:var(--f-display);margin-top:4px}
.vback{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:999px;padding:4px 14px;cursor:pointer}
@media (max-width:480px){.vrow{grid-template-columns:1fr}.vrow .vv{grid-column:1}}
</style>
</head>
<body>

<style>
.lock{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg)}
.lock-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 24px;box-shadow:0 6px 24px rgba(20,30,50,.06);text-align:center}
.lock-card h1{font-family:var(--f-display);font-size:1.5rem;margin:0 0 6px;color:var(--ink)}
.lock-card p{margin:0 0 20px;color:var(--muted);font-size:.92rem}
.lock-card input{width:100%;box-sizing:border-box;font:inherit;font-size:1.1rem;letter-spacing:.2em;text-align:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.lock-card input:focus{outline:2px solid var(--accent);outline-offset:1px}
.lock-card button{margin-top:12px;width:100%;font:inherit;font-weight:600;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
.lock-card button:disabled{opacity:.6;cursor:wait}
.lock-card label{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:12px;font-size:.85rem;color:var(--muted)}
.lock-err{min-height:1.2em;margin-top:10px;color:#b3261e;font-size:.88rem}
</style>
<div class="lock" id="lock">
  <form class="lock-card" id="lockForm" autocomplete="off">
    <h1>말씀요약 노트</h1>
    <p>비밀번호를 입력하면 내용을 볼 수 있습니다.</p>
    <input id="pw" type="password" inputmode="numeric" placeholder="비밀번호" aria-label="비밀번호" autofocus>
    <label><input type="checkbox" id="keep" style="width:auto"> 이 탭을 닫을 때까지 기억</label>
    <button id="go" type="submit">열기</button>
    <div class="lock-err" id="err" role="alert"></div>
  </form>
</div>
<div id="app" hidden></div>
<!--LOADER-->
</body>
</html>
